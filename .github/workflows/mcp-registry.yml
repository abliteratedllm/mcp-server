# Lists the version in server.json on the official MCP Registry (registry.modelcontextprotocol.io).
# Run it by hand after that version is on npm. GitHub OIDC grants the io.github.abliteratedllm/*
# namespace because this repository belongs to the abliteratedllm organization; no secret is needed.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v5

      - name: Check server.json against package.json
        run: |
          set -euo pipefail
          test "$(jq -r .name server.json)" = "$(jq -r .mcpName package.json)"
          test "$(jq -r .version server.json)" = "$(jq -r .version package.json)"
          test "$(jq -r '.packages[0].version' server.json)" = "$(jq -r .version package.json)"
          test "$(jq -r '.packages[0].identifier' server.json)" = "$(jq -r .name package.json)"

      - name: Wait until npm serves this version with mcpName
        run: |
          set -euo pipefail
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          expected="$(jq -r .mcpName package.json)"
          for attempt in $(seq 1 30); do
            actual="$(npm view "${name}@${version}" mcpName 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              echo "npm serves ${name}@${version} with mcpName ${actual}"
              exit 0
            fi
            echo "waiting for npm (${attempt}/30)…"
            sleep 10
          done
          echo "::error::npm does not serve ${name}@${version} with mcpName ${expected}. Publish to npm first."
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
